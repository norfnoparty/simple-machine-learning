<!doctype html>
<html>

<head>
    <title>Cetrekan Lampu</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="flex flex-row justify-content items-center min-h-screen w-full bg-black-20">
        <!-- Lampu 1 -->
        <div class="flex flex-col gap-2">
            <img src="assets/images/off.gif" id="lampu1" class="gambar" />
            <button onclick="saklar1('on')" class="inline-block rounded-sm border border-indigo-600 bg-indigo-600 px-12 py-3 text-sm font-medium text-white hover:bg-transparent hover:text-indigo-600">Lampu ON</button>
            <button onclick="saklar1('off')" class="inline-block border border-indigo-600 bg-indigo-600 px-12 py-3 text-sm font-medium text-white hover:bg-transparent hover:text-indigo-600">Lampu OFF</button>
        </div>
        <!-- Lampu 2 -->
        <div class="flex flex-col">
            <img src="assets/images/off.gif" id="lampu2" class="gambar" />
            <button onclick="saklar2('on')">Lampu ON</button>
            <button onclick="saklar2('off')">Lampu OFF</button>
        </div>
        <!-- Lampu 3 -->
        <div class="flex flex-col">
            <img src="assets/images/off.gif" id="lampu3" class="gambar" />
            <button onclick="saklar3('on')">Lampu ON</button>
            <button onclick="saklar3('off')">Lampu OFF</button>
        </div>
    </div>
    <script src="saklar.js" />
</body>

</html>
